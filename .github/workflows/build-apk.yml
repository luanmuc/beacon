name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "app/src/**"
      - "app/build.gradle"
      - "gradle/**"
      - "settings.gradle"
      - "build.gradle"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Detect Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}" || true

      - name: Generate self-use keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/keystore.jks" \
            -alias app -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass selfuse -keypass selfuse \
            -dname "CN=Self Use, OU=Self, O=Self, L=NA, ST=NA, C=CN"

      - name: Write local.properties
        run: |
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          storeFile=$GITHUB_WORKSPACE/keystore.jks
          keyAlias=app
          storePassword=selfuse
          keyPassword=selfuse
          EOF

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('gradle/libs.versions.toml','gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build leanback (TV) and mobile debug APKs
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleLeanbackDebug assembleMobileDebug

      - name: Collect APKs
        run: |
          mkdir -p out
          find app/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: out/*.apk
          retention-days: 30
