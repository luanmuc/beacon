name: build-apk

on:
  workflow_dispatch:
  schedule:
    - cron: "20 19 * * *"
  push:
    branches: [ main, april-base ]
    paths:
      - "app/src/**"
      - "app/libs/**"
      - "app/build.gradle"
      - "gradle/**"
      - "settings.gradle"
      - "build.gradle"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  media:
    name: build media3 aars
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout media3 fork
        id: media_checkout
        uses: actions/checkout@v4
        with:
          repository: luanmuc/media
          ref: release-1.11.0-fongmi
          path: media
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK env
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"

      - name: Resolve media commit
        id: media_sha
        run: echo "sha=$(git -C media rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache media aars by commit
        id: media_cache
        uses: actions/cache@v4
        with:
          path: aars
          key: media-aars-${{ steps.media_sha.outputs.sha }}

      - name: Cache Gradle (media3)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: media3-${{ runner.os }}-${{ hashFiles('media/gradle/libs.versions.toml', 'media/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: media3-${{ runner.os }}-

      - name: Build aars (parallel + build cache)
        if: steps.media_cache.outputs.cache-hit != 'true'
        working-directory: media
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --build-cache --parallel --max-workers=4 \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" \
            :lib-common:assembleRelease \
            :lib-container:assembleRelease \
            :lib-database:assembleRelease \
            :lib-datasource:assembleRelease \
            :lib-datasource-okhttp:assembleRelease \
            :lib-datasource-rtmp:assembleRelease \
            :lib-decoder:assembleRelease \
            :lib-decoder-ffmpeg:assembleRelease \
            :lib-effect:assembleRelease \
            :lib-extractor:assembleRelease \
            :lib-exoplayer:assembleRelease \
            :lib-exoplayer-dash:assembleRelease \
            :lib-exoplayer-hls:assembleRelease \
            :lib-exoplayer-rtsp:assembleRelease \
            :lib-exoplayer-smoothstreaming:assembleRelease \
            :lib-session:assembleRelease \
            :lib-ui:assembleRelease \
            :lib-ui-danmaku:assembleRelease \
            :lib-muxer:assembleRelease \
            :lib-transformer:assembleRelease \
            :lib-mpvplayer:assembleRelease

      - name: Collect aars
        if: steps.media_cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p aars
          find media -name "*.aar" -exec cp {} aars/ \;
          ls -lh aars | head -30

      - uses: actions/upload-artifact@v4
        with:
          name: media-aars
          path: aars/*.aar
          retention-days: 1
          if-no-files-found: error

  prepare:
    name: prepare signing key
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Restore persistent signing key
        id: keystore
        uses: actions/cache@v4
        with:
          path: keystore.jks
          key: beacon-keystore-v1

      - name: Generate signing key on first run
        if: steps.keystore.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/keystore.jks" \
            -alias app -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass selfuse -keypass selfuse \
            -dname "CN=Self Use, OU=Self, O=Self, L=NA, ST=NA, C=CN"

      - uses: actions/upload-artifact@v4
        with:
          name: beacon-keystore
          path: keystore.jks
          retention-days: 1
          if-no-files-found: error

  app:
    name: build ${{ matrix.slug }}
    needs: [prepare, media]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: Leanback
            abi: Arm64_v8a
            slug: leanback-arm64_v8a
          - mode: Leanback
            abi: Armeabi_v7a
            slug: leanback-armeabi_v7a
          - mode: Mobile
            abi: Arm64_v8a
            slug: mobile-arm64_v8a
          - mode: Mobile
            abi: Armeabi_v7a
            slug: mobile-armeabi_v7a
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK env
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true

      - name: Fetch media3 aars
        uses: actions/download-artifact@v4
        with:
          name: media-aars
          path: app/libs

      - name: Fetch signing key
        uses: actions/download-artifact@v4
        with:
          name: beacon-keystore
          path: .

      - name: Write local.properties
        run: |
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          storeFile=$GITHUB_WORKSPACE/keystore.jks
          keyAlias=app
          storePassword=selfuse
          keyPassword=selfuse
          EOF

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Bump version
        run: |
          set -e
          VCODE=${GITHUB_RUN_NUMBER}
          sed -i -E "s/versionCode [0-9]+/versionCode $((VCODE + 9000))/" app/build.gradle
          sed -i -E "s/versionName \"[0-9.]+\"/versionName \"1.0.${VCODE}\"/" app/build.gradle
          grep -E "versionCode|versionName" app/build.gradle

      - name: Build ${{ matrix.slug }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --build-cache --parallel --max-workers=3 \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g" \
            assemble${{ matrix.mode }}${{ matrix.abi }}Release

      - name: Collect APK
        run: |
          mkdir -p out
          find app/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          ls -lh out

      - name: Rename APK
        run: |
          set -e
          for f in out/*.apk; do
            base=$(basename "$f" .apk)
            mv "$f" "out/beacon-${{ github.run_number }}-${base}.apk"
          done
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.slug }}
          path: out/*.apk
          retention-days: 1
          if-no-files-found: error

  release:
    name: publish release
    needs: app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 12

      - uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          merge-multiple: true
          path: out

      - name: Generate CHANGELOG
        run: |
          git log -12 --pretty=format:"- %s (%h)" > CHANGELOG.tmp
          { echo "# 变更记录"; echo; cat CHANGELOG.tmp; } > CHANGELOG.md
          rm -f CHANGELOG.tmp

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: v1.0.${{ github.run_number }}
          body_path: CHANGELOG.md
          files: out/*.apk
